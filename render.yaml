services:
  - type: web
    name: bbat104-online-quiz-security
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: QUIZ_DB_PATH
        value: /var/data/quiz_system.db
    disk:
      name: quiz-data
      mountPath: /var/data
      sizeGB: 1
